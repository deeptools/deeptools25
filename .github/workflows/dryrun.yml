name: dryruns
on:
    push:
    pull_request:

jobs:
    pixi:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Pixi
              uses: prefix-dev/setup-pixi@v0.9.6
              with:
                  cache: true
            - name: dryrun-example
              run: |
                  pixi run snakemake -s example/example.smk --cores 4 --dryrun
            - name: dryrun-benchmark
              run: |
                  pixi run snakemake -s benchmark/benchmark.smk --cores 4 --dryrun


