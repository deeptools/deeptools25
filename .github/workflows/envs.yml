name: benchmark
on:
    push:
    pull_request:

jobs:
    pixi:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Pixi
              uses: prefix-dev/setup-pixi@v0.9.6
              with:
                  cache: true
            - name: dryrun
              run: |
                  pixi run snakemake -s example/example.smk --configfile example/conf/smk_config.yaml --cores 4 --dryrun
