name: generate_figs
on:
    push:
    pull_request:

jobs:
    pixi:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Pixi
              uses: prefix-dev/setup-pixi@v0.9.6
              with:
                  cache: true
            - name: dryrun-example
              run: |
                  pixi run python figures/figure1/fig1_subfigs.py
                  pixi run typst compile -f png figures/figure1/fig1.typ --ppi 300
                  pixi run typst compile -f pdf figures/figure1/fig1.typ --ppi 300
