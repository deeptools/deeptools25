use-conda: True
keep-going: True
rerun-incomplete: True
printshellcmds: True
jobs: 30
cores: 72
max-jobs-per-second: 1
max-status-checks-per-second: 2
restart-times: 2
max-inventory-time: 600
latency-wait: 1200
config:
  - "repeats=10"
executor: slurm
default-resources:
  slurm_partition: general
  runtime: 24h

  # Same exclusive-node reservation as slurm-profile/ (see that config's
  # comments for the 72/144 physical-vs-logical core rationale). We keep
  # reserving the whole node here too -- the only thing this profile
  # changes is how many threads each *tool* actually uses (set-threads
  # below), to get a more realistic HPC measurement: most users submitting
  # to this cluster won't request -p 72, but they will often still land on
  # an exclusive/big-memory node depending on their partition.
  cpus_per_task: 72
  slurm_extra: "'--exclusive'"

  # node-local /tmp filled up on dt4 jobs (large temp bam/bigwig merges) ->
  # "No space left on device" (StorageFull) on bamcoverage_dt4_human and
  # bamcompare_dt4. Redirect to ptmp scratch (1.6PB free) instead.
  tmpdir: "/raven/ptmp/asalatino/tmp"

# cpus_per_task above reserves the whole 72-core node exclusively regardless
# of a rule's `threads:` -- that only controls the SLURM allocation. Each
# tool is still invoked with `-p {threads}`/`-@ {threads}`, so without this
# override every rule keeps using whatever thread count is hardcoded in the
# Snakefile (e.g. threads: 4). Set to 24 here (vs. 72 in slurm-profile/) as
# a more representative thread count for typical users of this cluster.
set-threads:
  alsieve_dt4: 24
  alsieve_dt3: 24
  bamcompare_dt4: 24
  bamcompare_dt3: 24
  bamcoverage_dt4_human: 24
  bamcoverage_dt3_human: 24
  computeMatrix_dt4: 24
  computeMatrix_dt3: 24
  multibamsummary_dt4: 24
  multibamsummary_dt3: 24
  cram_to_bam: 24
  download_data: 24

set-resources:
  plot_benchmarks:
    runtime: 30

  # 2026-08-10 MPCDF os=MPCDF run @ 72 threads OOM-killed these rules against
  # the Snakefile's hardcoded mem_mb (see slurm-profile/config.yaml history);
  # carrying the same proven-sufficient caps over here unchanged. Per-thread
  # buffer/chunk memory only grows with thread count, so whatever ceiling
  # worked at 72 threads is a safe (if generous) upper bound at 24 -- no
  # reason to re-derive lower values by trial and error when there's no cost
  # to the higher cap on an exclusively-reserved node.
  bamcompare_dt4:
    mem_mb: 40000
  multibamsummary_dt3:
    mem_mb: 40000
  computeMatrix_dt4:
    mem_mb: 220000
