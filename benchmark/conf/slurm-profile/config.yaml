use-conda: True
keep-going: True
rerun-incomplete: True
printshellcmds: True
jobs: 30
cores: 72
max-jobs-per-second: 1
max-status-checks-per-second: 2
restart-times: 2
max-inventory-time: 600
latency-wait: 1200
config:
  - "repeats=10"
executor: slurm
default-resources:
  slurm_partition: general
  runtime: 24h

  # we are aiming directly to reserve one of the bigger nodes just for us. this is wrong.
  # but somewhat justified for a benchmark...
  # raven nodes: 72 PHYSICAL cores, 144 logical via hyperthreading.
  # sbatch --cpus-per-task counts physical cores here; 144 gets rejected
  # ("Requested node configuration is not available"), confirmed via
  # sbatch --test-only binary search. 72 + --exclusive allocates the
  # whole node (both hyperthreads), same intended effect.
  cpus_per_task: 72
  slurm_extra: "'--exclusive'"

  # node-local /tmp filled up on dt4 jobs (large temp bam/bigwig merges) ->
  # "No space left on device" (StorageFull) on bamcoverage_dt4_human and
  # bamcompare_dt4. Redirect to ptmp scratch (1.6PB free) instead.
  tmpdir: "/raven/ptmp/asalatino/tmp"

# We don't set per-rule `mem:` here. Each SLURM job already gets a whole
# node exclusively (see cpus_per_task + --exclusive above), so there's no
# other tenant to protect by capping memory, and no cluster efficiency to
# gain by tightening it -- the node's memory is ours either way. A `mem:`
# value only matters as a SLURM cgroup ceiling that can OOM-kill a job for
# going over it, which is a risk with no offsetting benefit here. Left as
# reference only: values below are 1.3x the peak max_rss actually observed
# in results/performance.csv (2026-07-31 full-suite run), i.e. what we'd
# set if we ever did want a real cap.
#   alsieve_dt3:            ~1.2GB   (peak 0.93GB)
#   alsieve_dt4:             ~0.1GB   (peak 0.06GB)
#   bamcoverage_dt3_human:  ~3.3GB   (peak 2.52GB)
#   bamcoverage_dt4_human: ~10.5GB   (peak 8.06GB)
#   bamcompare_dt3:         ~3.4GB   (peak 2.61GB)
#   bamcompare_dt4:        ~15.2GB   (peak 11.70GB)
#   computeMatrix_dt3:      ~7.4GB   (peak 5.71GB)
#   computeMatrix_dt4:     ~62.7GB   (peak 48.23GB)
#   multibamsummary_dt3:    ~6.6GB   (peak 5.05GB)
#   multibamsummary_dt4:    ~0.8GB   (peak 0.64GB)
# set-resources:
#   alsieve_dt3:
#     mem: 2GB
#   alsieve_dt4:
#     mem: 1GB
#   bamcoverage_dt3_human:
#     mem: 4GB
#   bamcoverage_dt4_human:
#     mem: 12GB
#   bamcompare_dt3:
#     mem: 4GB
#   bamcompare_dt4:
#     mem: 16GB
#   computeMatrix_dt3:
#     mem: 8GB
#   computeMatrix_dt4:
#     mem: 64GB
#   multibamsummary_dt3:
#     mem: 8GB
#   multibamsummary_dt4:
#     mem: 1GB

# cpus_per_task above reserves the whole 72-core node exclusively regardless
# of a rule's `threads:` -- that only controls the SLURM allocation. Each
# tool is still invoked with `-p {threads}`/`-@ {threads}`, so without this
# override every rule keeps using whatever thread count is hardcoded in the
# Snakefile (e.g. threads: 4), leaving most of the reserved node idle.
set-threads:
  alsieve_dt4: 72
  alsieve_dt3: 72
  bamcompare_dt4: 72
  bamcompare_dt3: 72
  bamcoverage_dt4_human: 72
  bamcoverage_dt3_human: 72
  computeMatrix_dt4: 72
  computeMatrix_dt3: 72
  multibamsummary_dt4: 72
  multibamsummary_dt3: 72
  cram_to_bam: 72
  download_data: 72

set-resources:
  plot_benchmarks:
    runtime: 30
    # mem: 4GB  (see comment above -- not worth setting, node is ours regardless)

  # 2026-08-10 MPCDF os=MPCDF run @ 72 threads: these rules OOM-killed against
  # the Snakefile's hardcoded mem_mb, which was sized for the old low-thread
  # runs. SLURM enforces mem_mb as a hard per-job cgroup cap independent of
  # the --exclusive whole-node reservation. Bumped conservatively (~2x
  # observed kill point) rather than maxing out to the node's ~240GB ceiling.
  #
  # bamcompare_dt4 and multibamsummary_dt3 are genuinely thread-driven: -p 72
  # inflates their per-thread buffer/chunk memory well beyond -p 24 (compared
  # against the 2026-08-11 24-thread run, same inputs: ~1.1-2.9x more memory
  # at 72 threads depending on sample).
  bamcompare_dt4:
    mem_mb: 40000   # was 20000 (Snakefile default); killed at ~19.9GB/20GB
  multibamsummary_dt3:
    mem_mb: 40000   # was 20000 (Snakefile default); killed at ~19.9GB/20GB
  computeMatrix_dt4:
    # was 120000 (Snakefile default); killed at ~119.9GB/120GB on the 15-track
    # case. Bumped to 180000, still killed at ~179.9GB/180GB but ran 3.5x
    # longer first, i.e. still climbing, not misconfigured -- genuinely needs
    # more for the 15-bigwig triticum matrix. Unlike the two rules above,
    # this is NOT thread-driven: the 2026-08-11 24-thread run needed ~154GB
    # for this same case too (vs. ~155GB at 72 threads, essentially flat) --
    # the memory need comes from input size (15 tracks x whole-genome
    # bigwigs), not from -p. ravc nodes have 240000MB total; 220000 leaves
    # ~20GB headroom for the OS/cgroup overhead, close to the practical
    # ceiling this rule can ever get on this node size regardless of threads.
    mem_mb: 220000
