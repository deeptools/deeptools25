[workspace]
authors = ["WardDeb <w@rddeboutte.com>"]
channels = ["conda-forge", "bioconda"]
name = "deeptools25"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
clang = "*"
libclang = "*"
perl = "*"
sra-tools = "*"
samtools = "*"
methyldackel = "*"
wiggletools = "*"
ucsc-wigtobigwig = "*"
ucsc-bedgraphtobigwig = "*"
uropa = "*"
pandas = "*"
r-tidyr = "*"
r-dplyr = "*"
bioconductor-edger = "*"
subread = "*"
pip = "*"
macs3 = "*"
bedtools = "*"
matplotlib = "*"
seaborn = "*"
typst = "*"
snakemake = ">=9.9"

[pypi-dependencies]
snakemake-storage-plugin-zenodo = "*"
snakemake-executor-plugin-cluster-generic = "*"
snakemake-executor-plugin-slurm = "*"
deeptools = { git = "https://github.com/deeptools/deepTools.git", rev = "fd19d2ec84f00392282787d925eb1c8317121b5b" }

[activation.env]
LIBCLANG_PATH = "$CONDA_PREFIX/lib"
CFLAGS = "-I$CONDA_PREFIX/include"
