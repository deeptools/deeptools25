[workspace]
authors = ["WardDeb <w@rddeboutte.com>"]
channels = ["conda-forge", "bioconda"]
name = "deeptools25"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
clang = "*"
libclang = "*"
perl = "*"
sra-tools = "*"
samtools = "*"
methyldackel = "*"

[pypi-dependencies]
snakemake = "== 9.9"
snakemake-storage-plugin-zenodo = "*"
snakemake-executor-plugin-cluster-generic = "*"
deeptools = { git = "https://github.com/deeptools/deepTools.git", rev = "benchmarking_4.0.0" }

[tool.pixi.environment]
CFLAGS = "-I${PIXI_ENVIRONMENT_PATH}/include"
LIBCLANG_PATH = "-L${PIXI_ENVIRONMENT_PATH}/lib"