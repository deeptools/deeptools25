restart-times: 2
use-conda: True
keep-going: True
rerun-incomplete: True
printshellcmds: True
jobs: 10
max-jobs-per-second: 1
max-status-checks-per-second: 2
max-inventory-time: 600
latency-wait: 1200
executor: slurm
wait-for-files:
  - zenodo/triticum_chip_SRR1686799.bam
  - zenodo/bigwigs/human_chip_SRR28592125.bw
  - zenodo/bigwigs/human_rna_SRR28012905.bw
  - zenodo/bigwigs/human_rna_SRR28012904.bw
  - zenodo/bigwigs/human_chip_SRR28592124.bw
  - zenodo/bigwigs/human_rna_SRR28012902.bw
  - zenodo/bigwigs/human_chip_SRR28592132.bw
  - zenodo/bigwigs/human_wgs_SRR15494527.bw
  - zenodo/bigwigs/human_chip_SRR28592131.bw
  - zenodo/bigwigs/human_rna_SRR28012903.bw
  - zenodo/triticum_chip_SRR1686799.bam.csi
  - zenodo/triticum_chip_SRR1686799_reverse.bw
  - zenodo/triticum_chip_SRR1686799_markdup.bw
  - zenodo/triticum_chip_SRR1686799_nodup.bw
  - zenodo/human_rna_SRR28012902.bam.bai
  - zenodo/human_rna_SRR28012902.bam
  - zenodo/triticum_rna_SRR27822150.bam
  - zenodo/triticum_rna_SRR27822150.bam.csi
  - zenodo/triticum_chip_SRR1686799_mapq10.bw
  - zenodo/human_chip_SRR28592124.bam
  - zenodo/triticum_wgs_SRR27887047.bam.csi
  - zenodo/human_wgs_SRR15494527.bam
  - zenodo/human_chip_SRR28592124.bam.bai
  - zenodo/triticum_chip_SRR1686799_fw.bw
  - zenodo/human_wgs_SRR15494527.bam.bai
  - zenodo/triticum_wgs_SRR27887047.bam
default-resources:
  slurm_partition: general
  runtime: 2h
  cpus: 64
set-resources:
  # bamCoverage{1,2} have 3 protocols, hence it has more of resources than 'expected'
  bamCoverage1:
    mem: 12GB * attempt
  bamCoverage2:
    mem: 12GB * attempt
  bamCompare1:
    mem: 12GB * attempt
  bamCompare2:
    mem: 12GB * attempt
  computeMatrix1:
    mem: 4GB * attempt
  computeMatrix2:
    mem: 2GB * attempt
  multiBamSummary1:
    mem: 8GB * attempt
  multiBamSummary2:
    mem: 4GB * attempt
  process_results:
    runtime: 20
    cpus: 1
    mem: 3GB
